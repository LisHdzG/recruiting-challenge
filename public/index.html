<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merchant Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      .merchant-picker { margin-bottom: 1rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0; }
      .card { border: 1px solid #ccc4; border-radius: 8px; padding: 1rem; }
      .card .label { font-size: 0.85rem; opacity: 0.7; }
      .card .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.25rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ccc4; }
      th { font-weight: 600; opacity: 0.8; }
      .muted { opacity: 0.6; }
      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; align-items: end; }
      .filters label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; }
      .filters input, .filters select { font: inherit; padding: 0.3rem; min-width: 0; }
      .filters .actions { display: flex; gap: 0.5rem; }
      .error { color: #c0392b; margin: 0.75rem 0 0; white-space: pre-line; }
      .amount { text-align: right; }
      #load-more { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>Merchant Dashboard</h1>
    <p class="muted">Tiny demo dashboard backed by the local API.</p>

    <div class="merchant-picker">
      <form id="key-form">
        <label>API key:
          <input id="key-input" type="password" autocomplete="off" size="40" required />
        </label>
        <button type="submit">Sign in</button>
        <span id="key-error" class="muted"></span>
      </form>
      <div id="session" hidden>
        Signed in as <strong id="merchant-id"></strong>
        <button id="sign-out" type="button">Sign out</button>
      </div>
    </div>

    <section>
      <h2>Summary</h2>
      <div class="cards" id="summary-cards">
        <div class="card"><div class="label">Total orders</div><div class="value" id="total-orders">—</div></div>
        <div class="card"><div class="label">Unique customers</div><div class="value" id="unique-customers">—</div></div>
        <div class="card"><div class="label">Avg order value</div><div class="value" id="avg-order">—</div></div>
        <div class="card"><div class="label">Revenue (last 30 days)</div><div class="value" id="revenue-30d">—</div></div>
      </div>
    </section>

    <section>
      <h2>Orders</h2>
      <form id="orders-form" class="filters">
        <label>Email starts with
          <input name="customer_email" type="text" maxlength="254" autocomplete="off" placeholder="ana@" />
        </label>
        <label>Type
          <select name="type">
            <option value="">All</option>
            <option value="sale">sale</option>
            <option value="refund">refund</option>
          </select>
        </label>
        <label>Status
          <select name="status">
            <option value="">All</option>
            <option value="completed">completed</option>
          </select>
        </label>
        <label>From (UTC day)
          <input name="from" type="date" />
        </label>
        <label>To (UTC day, included)
          <input name="to" type="date" />
        </label>
        <label>Min amount ($)
          <input name="min_amount" type="number" min="0.01" max="1000000" step="0.01" inputmode="decimal" />
        </label>
        <label>Max amount ($)
          <input name="max_amount" type="number" min="0.01" max="1000000" step="0.01" inputmode="decimal" />
        </label>
        <div class="actions">
          <button type="submit">Search</button>
          <button type="reset">Clear</button>
        </div>
      </form>
      <p id="orders-error" class="error" role="alert" hidden></p>
      <table>
        <thead>
          <tr><th>Date (UTC)</th><th>Customer</th><th>Type</th><th>Status</th><th class="amount">Amount</th></tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
      <p id="orders-status" class="muted"></p>
      <button id="load-more" type="button" hidden>Load more</button>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
